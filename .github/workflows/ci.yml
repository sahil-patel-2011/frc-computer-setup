name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        run: go test ./...
      - name: Build Windows orchestrator
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -H windowsgui" -o dist/FRC-Computer-Setup.exe ./cmd/frc-computer-setup
      - uses: actions/upload-artifact@v4
        with:
          name: FRC-Computer-Setup-windows
          path: dist/FRC-Computer-Setup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build Windows orchestrator
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -H windowsgui" -o dist/FRC-Computer-Setup.exe ./cmd/frc-computer-setup
      - name: Publish orchestrator only
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FRC-Computer-Setup.exe
          generate_release_notes: true
          body: |
            Orchestrator only. It downloads official vendor installers at runtime.
            Do not attach WPILib/NI/PathPlanner binaries to this release.
